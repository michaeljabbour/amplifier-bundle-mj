bundle:
  name: occams-machete-behavior
  version: 0.1.0
  description: |
    Wires the Occam's Machete capability onto a host bundle: the executioner
    agent, the persona skill (via tool-skills), and the /machete reduction mode
    (via the modes system: hooks-mode + tool-mode).

# Mount the modes system so /machete registers and switches at runtime.
includes:
  - bundle: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=behaviors/modes.yaml

hooks:
  - module: hooks-mode
    source: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=modules/hooks-mode
    config:
      search_paths:
        # The @occams-machete: prefix is resolved by hooks-mode itself (its own
        # @mention resolution), not by the bundle loader.
        - "@occams-machete:modes"
  # Surfaces MJ's review lens as an inline insight block on review/decision turns
  # (session:start → inject_context, mirroring hooks-insight-blocks). Fail-open.
  # NOTE: a relative source in a BEHAVIOR file resolves relative to behaviors/,
  # not the repo root — so go up one level to reach modules/ (verified in DTU).
  - module: hooks-mj-lens
    source: ../modules/hooks-mj-lens
    config:
      enabled: true
      priority: 50
  # Highlights notable Machete callouts — chiefly the proactive `/machete` mode
  # offer — as an inline ✂ block so they stand out (session:start → inject_context,
  # same mechanism as hooks-mj-lens / hooks-insight-blocks). Fail-open. Relative
  # source resolves relative to behaviors/, so up one level to reach modules/.
  - module: hooks-machete-blocks
    source: ../modules/hooks-machete-blocks
    config:
      enabled: true
      priority: 50

tools:
  - module: tool-mode
    source: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=modules/tool-mode
    config:
      gate_policy: "warn"
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-module-tool-skills@main
    # No bundle-local `skills:` entry, on purpose. tool-skills resolves a local
    # `skills:` path against the RUNTIME working directory (DTU-verified), NOT the
    # behavior dir — so no behavior-relative path can point at this bundle's skills/.
    # The only portable alternative is a remote git+URL of THIS repo: the circular
    # self-dependency we deliberately removed. So we ship no standalone skill entry.
    # The persona is still delivered where it matters: the occams-machete agent and
    # /machete mode inject it by @mention (@occams-machete:skills/...). This module
    # stays mounted only to provide the generic load_skill tool the mode references.
  # Lets the bundle's own reduction recipes (recipes/*.yaml) be executed.
  - module: tool-recipes
    source: git+https://github.com/microsoft/amplifier-bundle-recipes@main#subdirectory=modules/tool-recipes
    config:
      session_dir: ~/.amplifier/projects/{project}/recipe-sessions
      auto_cleanup_days: 7

# The executioner agent (the blade) and the MJ-lens reviewer ("what would MJ think?").
agents:
  include:
    - occams-machete:occams-machete
    - occams-machete:mj-reviewer

# Lightweight awareness only — always-on routing. The heavy artifacts (the persona
# SKILL, the MJ profile) are context sinks loaded on demand by their agents.
context:
  include:
    - occams-machete:context/machete-awareness.md
    - occams-machete:context/mj-lens-awareness.md
    # NOTE: modes-instructions.md is NOT listed here on purpose — the modes
    # behavior we include above already contributes it via its own
    # context.include. Listing it again double-loads ~420 always-on tokens.
