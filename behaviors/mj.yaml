bundle:
  name: mj-behavior
  version: 0.4.0
  description: |
    Wires MJ's review bench onto a host bundle: three agents (the Occam's Machete
    executioner, the mj-reviewer direction lens, and the crusty-old-engineer
    reliability guard), two skills (occams-machete and mj-lens, via tool-skills),
    two modes (/machete for reduction, /mj for review — via hooks-mode +
    tool-mode), and the inline insight / machete / MJ-lens callout blocks.
    Modes and skills are DIRECTORY-discovered: adding modes/<name>.md or
    skills/<name>/SKILL.md needs no new config here.

# Mount the modes system so /machete registers and switches at runtime.
includes:
  - bundle: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=behaviors/modes.yaml

hooks:
  - module: hooks-mode
    source: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=modules/hooks-mode
    config:
      search_paths:
        # The @mj: prefix is resolved by hooks-mode itself (its own
        # @mention resolution), not by the bundle loader.
        - "@mj:modes"
  # Surfaces the insight (★) / machete (✂) / MJ-lens (🔪) inline blocks. Consolidates
  # the three formerly-separate hooks-insight-blocks / hooks-machete-blocks /
  # hooks-mj-lens modules into one parametrized brick (see the module docstring for
  # the full rationale). This is a BUG FIX, not just a refactor: the predecessors
  # registered on session:start, but the kernel's session-lifecycle emission path
  # fires that event and never captures—applies the returned HookResult — confirmed
  # at the kernel-source level (core/foundation/amplifier experts). Their injections
  # never reached the model. `prompt:submit` IS routed through
  # process_hook_result()/context.add_message() (the proven hooks-explanatory
  # pattern), so this is the event that actually works. A per-(session_id,
  # block-name) fire-once guard reproduces the original "inject exactly once per
  # session" semantics on an event that fires every turn. Fail-open per block.
  # NOTE: a relative source in a BEHAVIOR file resolves relative to behaviors/,
  # not the repo root — so go up one level to reach modules/ (verified in DTU).
  - module: hooks-inline-blocks
    source: ../modules/hooks-inline-blocks
    config:
      event: prompt:submit
      ephemeral: false
      priority: 50
      blocks:
        - use: insight
        - use: machete
        - use: mj-lens

tools:
  - module: tool-mode
    source: git+https://github.com/microsoft/amplifier-bundle-modes@main#subdirectory=modules/tool-mode
    config:
      gate_policy: "warn"
  - module: tool-skills
    # Source the core-compatible copy maintained inside amplifier-bundle-skills.
    # The standalone amplifier-module-tool-skills@main lags amplifier-core 1.6.0:
    # its SkillsVisibilityHook.__init__ lacks the `is_forked_session` argument the
    # kernel now passes when forking a sub-session, so pinning it there fails module
    # load with "got an unexpected keyword argument 'is_forked_session'".
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    # Expose THIS bundle's own skills/ dir for load_skill directory-discovery.
    #
    # This was a git SELF-REFERENCE to remote HEAD, because an @mention used to
    # fail silently at mount: the mention_resolver capability is registered by the
    # app layer AFTER modules mount, so there was nothing to resolve against. That
    # is no longer true — tool-skills now stashes @-sources as pending and resolves
    # them one-shot at the first provider:request
    # (`SkillsTool.resolve_pending_mention_sources()`, source-verified).
    #
    # Why the change matters: the self-reference created a SECOND, independently
    # cached copy of this repo under ~/.amplifier/cache/skills/, keyed by URL and
    # with no TTL or revalidation. `amplifier bundle update` refreshed the bundle
    # cache and left that one stale, so a newly-shipped skill stayed invisible until
    # someone manually deleted the cache dir — which is exactly what happened when
    # mj-lens was added. The @mention resolves against the bundle cache the loader
    # already maintains: one copy, one refresh path, no push-then-wait.
    #
    # A bundle-local RELATIVE path is still wrong here — it resolves against the
    # runtime cwd (DTU-verified, breaks). The @mention is the correct form.
    config:
      skills:
        - "@mj:skills"
  # Lets the bundle's own reduction recipes (recipes/*.yaml) be executed.
  - module: tool-recipes
    source: git+https://github.com/microsoft/amplifier-bundle-recipes@main#subdirectory=modules/tool-recipes
    config:
      session_dir: ~/.amplifier/projects/{project}/recipe-sessions
      auto_cleanup_days: 7

# The panel: the executioner (the blade), the MJ-lens reviewer ("what would MJ
# think?" — direction), and the Crusty Old Engineer (the reliability guard —
# "will it break, and what will it cost?").
agents:
  include:
    - mj:occams-machete
    - mj:mj-reviewer
    - mj:crusty-old-engineer

# Lightweight awareness only — always-on routing. The heavy artifacts (the persona
# SKILL, the MJ profile) are context sinks loaded on demand by their agents.
context:
  include:
    - mj:context/machete-awareness.md
    - mj:context/mj-lens-awareness.md
    # NOTE: modes-instructions.md is NOT listed here on purpose — the modes
    # behavior we include above already contributes it via its own
    # context.include. Listing it again double-loads ~420 always-on tokens.
