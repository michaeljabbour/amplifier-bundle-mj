# Extraction hint. The agent runs from /workspace, so its sessions live under the
# `-workspace` project slug. Pull the full session tree (for post-hoc analysis of
# HOW the agent reasoned) plus the design deliverable. The grader scores from the
# DTU directly; this capture is for the record.
session_data:
  base_path: /root/.amplifier/projects/-workspace/sessions/{session_id}
  files:
    - transcript.jsonl
    - metadata.json
    - events.jsonl

workspace:
  path: /workspace
  deliverables:
    - design.md
    - eval-run.out
