# Session tree + modified repo + the panel verdict (proves the council fired).
session_data:
  base_path: /root/.amplifier/projects/-workspace/sessions/{session_id}
  files:
    - transcript.jsonl
    - metadata.json
    - events.jsonl

workspace:
  path: /workspace
  deliverables:
    - shop
    - tests
    - council-review.md
    - eval-run.out
