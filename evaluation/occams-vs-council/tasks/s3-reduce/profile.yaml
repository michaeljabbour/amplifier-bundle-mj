name: occams-vs-council-s3
description: >
  Ubuntu 24.04 with uv + git. The over-built design (over-built-design.md) is staged
  into /workspace by the harness seeding stage (from this task's workspace/ dir) before
  the agent runs. The agent reads it and writes an improved design.md into /workspace.
  Each variant installs its own bundle(s) from GitHub (see the agent's install.yaml).

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY

provision:
  setup_cmds:
    - apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates tmux && rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - mkdir -p /workspace

readiness:
  - name: uv-installed
    command: "PATH=/root/.local/bin:$PATH uv --version"
  - name: workspace-exists
    command: "test -d /workspace && echo OK"
