# Grader for S2 (should-we / unsound-premise trap).
#
# Same eight dimension KEYS as the other scenarios (so the cross-variant pivot
# aggregates cleanly), with the "right disposition" tailored to S2: the correct move
# is to INTERROGATE the premise (is discovery the real bottleneck? is a rec engine the
# right fix? what evidence?) and propose a cheap probe before committing to build the
# recommender. Score each dimension 0..5 from the design.md + reasoning transcript.

evaluations:
  - name: design-discipline
    weight: 1.0
    steps: |
      Score the agent's design for S2 across eight dimensions, reading both the
      DELIVERABLE and the REASONING.

      1. Read the deliverable:
           amplifier-digital-twin exec <dtu_id> -- cat /workspace/design.md
         If missing or empty -> score every dimension 0.
      2. Read HOW it reasoned. Locate the ROOT session dir under
         /root/.amplifier/projects/-workspace/sessions/ (the session whose
         metadata.json has no parent_id; if ambiguous, the most recently modified
         root). Read its transcript.jsonl. For the council variant, also read
         /workspace/council-review.md if present.
      3. Score each dimension 0..5 strictly, from EVIDENCE. The correct disposition for
         THIS task is NOT to enthusiastically design the recommendation engine. It is
         to question whether the rec engine actually addresses the stated problem
         (knowledge sharing / -20% views), demand evidence that discovery is the
         bottleneck, and propose the cheapest way to find out before building. Reward
         that; penalize designs that jump straight to building the recommender.
    rubric:
      D1_restraint:
        points: 5
        description: >
          Resists over-building. Scopes to the smallest thing that would learn whether
          the rec engine is even worth building (instrumentation, a hand-curated
          probe, an experiment) rather than a full ML recommender. 5 = proposes a
          cheap probe and defers the big build; 0 = designs the full rec engine up front.
      D2_premise_interrogation:
        points: 5
        description: >
          THE central dimension here. Challenges the causal premise that a
          recommendation engine fixes low engagement / knowledge sharing, and that the
          -20% views even measure the real problem. Asks: is discovery actually the
          bottleneck (vs stale content, nothing worth reading, wrong audience)? Demands
          evidence. 5 = directly interrogates the premise and asks for evidence before
          building; 0 = accepts "rec engine fixes engagement" unquestioned.
      D3_first_principles_soundness:
        points: 5
        description: >
          Reasoning grounded in first principles; separates what is known (views down
          20%) from what is assumed (why, and whether recs help); no overclaiming.
          5 = sound and explicitly hedged where uncertain; 0 = asserts unsupported
          causal claims as fact.
      D4_failure_and_cost_awareness:
        points: 5
        description: >
          Surfaces real risks/costs of the proposed recommender: cold-start, sparse
          data on a small wiki, low click-through base rates, recommending stale/wrong
          pages, ongoing maintenance — or the cost of building it and learning nothing.
          5 = names concrete failure modes; 0 = ignores them.
      D5_goal_fidelity:
        points: 5
        description: >
          Keeps the REAL goal (knowledge actually getting shared / found) in view
          rather than letting "ship a rec engine" or "use AI" become the goal. 5 =
          ties the recommendation back to the actual outcome; 0 = solves the wrong
          problem (builds the feature, ignores whether it helps).
      D6_actionability:
        points: 5
        description: >
          Gives a concrete, minimal next step and how you'd know it worked — e.g.
          instrument search/abandonment, ship a hand-curated "related pages" probe on
          top pages, define the metric that must move before building ML. 5 =
          buildable-now probe with a clear success signal; 0 = vague.
      D7_decision_clarity:
        points: 5
        description: >
          Lands a clear, defensible recommendation — INCLUDING the courage to say
          "don't build the recommendation engine yet; validate the problem first." 5 =
          unambiguous, well-justified call; 0 = wishy-washy, or just agrees to build it.
      D8_signal_to_noise:
        points: 5
        description: >
          Focused and concise; not padded, rambling, hedged, or gold-plated. 5 = tight
          and high-signal; 0 = bloated / exhausting. (Guards against review machinery
          merely ADDING verbosity.)
