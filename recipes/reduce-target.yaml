# =============================================================================
# CHANGELOG
# =============================================================================
#
# v1.1.0 (2026-06-07):
#   - CRITICAL FIX: A red (or no-tests) baseline now BLOCKS structural reduction.
#     * ROOT CAUSE (logic): The whole safety argument is "green BEFORE and green
#       AFTER ⇒ behavior preserved." green-BEFORE is load-bearing. Cutting from a
#       red baseline makes "green on both sides" vacuous — you cannot detect the
#       regression you cause, because the suite was already failing. The recipe
#       previously surfaced a red baseline and then cut anyway.
#     * ROOT CAUSE (bug that made the premise unobservable): the baseline step ran
#       `{{test_command}} ... || echo ...`, so on failure the trailing `echo`
#       exited 0 and `baseline_exit_code` was ALWAYS "0". Any exit-code gate would
#       have been a silent no-op. The baseline now preserves the real exit code.
#     * FIX: Gate `machete-reduce` and `verify-final` on `baseline_exit_code == '0'`.
#       On a non-zero baseline the recipe short-circuits to a terminal stop step
#       (`baseline-red-stop`) and makes NO file edits.
#     * RESULT: structural cuts are impossible from a red/no-tests baseline.
#
# v1.0.0 (2026-06-07):
#   - NEW FEATURE: Initial single-target reduction recipe
#     * Enforces a green test baseline before any cut (structural guardrail)
#     * Delegates the actual reduction to occams-machete:occams-machete
#     * Re-runs tests as a post-condition so green-on-both-sides is recorded
#
# =============================================================================

name: "reduce-target"
description: >-
  Single-target complexity reduction with enforced before/after test
  verification. Records a baseline and BLOCKS the cut unless it is green, then
  lets the Machete amputate accidental complexity one reversible stroke at a
  time, then re-verifies tests.
version: "1.1.0"
author: "Occam's Machete bundle"
tags: ["reduction", "simplification", "occams-machete"]

# Requirements:
#   - occams-machete bundle loaded (provides occams-machete:occams-machete agent)
#
# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=occams-machete:recipes/reduce-target.yaml \
#     context='{"target_path": "src/mymodule"}'

context:
  target_path: ""                       # Required: file/module/dir to reduce
  test_command: "python -m pytest -q"   # Optional: the safety-net test command

steps:
  # ---------------------------------------------------------------------------
  # Step 1: Record the BASELINE and capture its TRUE exit code.
  #
  # green-BEFORE is load-bearing for the whole safety argument, so the exit code
  # must reflect reality. We deliberately do NOT mask the test command's exit
  # status (no `|| echo`), and we `exit $baseline_ec` so `baseline_exit_code`
  # carries the genuine result. `on_error: continue` keeps the recipe alive so
  # the gate below — not a hard crash — decides what happens next.
  # ---------------------------------------------------------------------------
  - id: "record-baseline"
    type: "bash"
    command: |
      echo "=== BASELINE: {{test_command}} ==="
      {{test_command}} 2>&1
      baseline_ec=$?
      if [ "$baseline_ec" -eq 0 ]; then
        echo "[baseline GREEN — exit 0]"
      else
        echo "[baseline NOT GREEN — exit $baseline_ec — structural cuts will be blocked]"
      fi
      exit $baseline_ec
    output: "baseline_tests"
    output_exit_code: "baseline_exit_code"
    on_error: "continue"
    timeout: 1800

  # ---------------------------------------------------------------------------
  # GATE (red path): if the baseline is non-zero (RED) or no tests were found
  # (pytest exits 5 ⇒ non-zero), STOP here. No agent step that could edit files
  # runs on this path. This step is the only thing that fires when red.
  # ---------------------------------------------------------------------------
  - id: "baseline-red-stop"
    type: "bash"
    condition: "{{baseline_exit_code}} != '0'"
    command: |
      cat <<'EOF'
      ===========================================================
      STRUCTURAL REDUCTION BLOCKED — RED BASELINE
      ===========================================================

      The safety net was not green before any cut (baseline exit
      code: {{baseline_exit_code}}). The reduction contract depends
      on "green BEFORE and green AFTER ⇒ behavior preserved." From a
      red (or no-tests) baseline that proof is vacuous: a cut cannot
      be shown to preserve behavior, because the suite cannot detect
      the regression the cut might introduce.

      No files were modified.

      The only valid next moves are:
        1. Characterize / repair the test suite to GREEN first, then
           re-run this recipe, OR
        2. Proceed MANUALLY, with a human owning the risk that the
           safety net is not trustworthy.

      Automated structural cuts are not permitted from a red baseline.
      EOF
      exit 0
    on_error: "continue"
    timeout: 60

  # ---------------------------------------------------------------------------
  # Step 2 (green path only): the cut. Runs ONLY when the baseline is green.
  # ---------------------------------------------------------------------------
  - id: "machete-reduce"
    condition: "{{baseline_exit_code}} == '0'"
    agent: "occams-machete:occams-machete"
    prompt: |
      Reduce the complexity of: {{target_path}}

      Safety-net test command: {{test_command}}

      Green baseline (exit code {{baseline_exit_code}}):
      ---
      {{baseline_tests}}
      ---

      Apply your full contract:
        1. Establish the job — what is this target actually for?
        2. Establish the safety net — confirm {{test_command}} is the guard you
           re-run after every stroke.
        3. Inventory BEFORE amputating. A zero-caller grep is NOT sufficient
           proof. Before removing anything, rule out:
             - dynamic references (reflection, getattr, string dispatch,
               importlib, entry points, registries)
             - public-symbol / out-of-repo consumers (exported API, plugin
               surface, anything other code or other repos may import)
        4. Cut smallest-and-safest first; one reversible stroke at a time.
        5. Re-run {{test_command}} after EACH stroke. Revert any stroke that
           reddens the suite.
        6. End with the body count report:
           -N lines, -M files, -K abstractions, tests green.

      Make the cuts. Then report the body count.
    output: "machete_report"
    timeout: 3600

  # ---------------------------------------------------------------------------
  # Step 3 (green path only): post-condition. Re-run the suite so the recipe
  # records that tests are green AFTER the reduction as well. Skipped on the red
  # path (nothing was cut, so there is nothing to re-verify).
  # ---------------------------------------------------------------------------
  - id: "verify-final"
    condition: "{{baseline_exit_code}} == '0'"
    type: "bash"
    command: |
      echo "=== POST-CONDITION: {{test_command}} ==="
      {{test_command}} 2>&1
    output: "final_tests"
    output_exit_code: "final_exit_code"
    on_error: "continue"
    timeout: 1800
