#   - NEW: A pre-flight reliability guard. Gathers the review surface (the diff
#     and the changed files), then runs the Crusty Old Engineer to catch the two
#     classes the direction/reduction lenses skip: obvious FAILURES (contract
#     violations, lagging refs, load/fork fragility, silent failure) and
