# =============================================================================
# CHANGELOG
# =============================================================================
#
# v2.0.0 (2026-08-13):
#   - CRITICAL FIX: the panel now convenes real independent agents.
#     * ROOT CAUSE: all three "lenses" were prompt sections sent to ONE agent —
#       mj:occams-machete, the blade — which was asked to role-play Cranky Old
#       Sam and the Crusty Old Engineer "if available". So the agent that wants
#       to cut was also grading whether cutting was risky. That is the circular
#       reasoning this bundle's own discipline forbids: independence collapse,
#       not a lens panel. `preflight-guard.yaml` already delegated to the real
#       crusty-old-engineer agent correctly; this recipe simply predated it.
#     * FIX: Stage A is now TWO steps. `risk-review` delegates to the real
#       mj:crusty-old-engineer agent, which returns its own BLOCKERS/RISKS/
#       SAFE-TO-CUT contract. `panel-review` then delegates to the blade, which
#       receives those findings as evidence it did not produce, and must honor
#       them: a BLOCKER never enters the plan (disagreement is escalated to the
#       human at the approval gate, not resolved by cutting), and a RISK enters
#       only with the extra proof that answers it.
#     * REMOVED: the Cranky Old Sam role-play. "Does this earn its existence?"
#       is already the blade's own discipline, encoded in its skill.
#     * SCOPE: mj-reviewer is deliberately NOT convened. Direction was decided
#       when the human chose to run a reduction pipeline; adding it here is the
#       unrequested ceremony the bundle's own principles warn about.
#     * UNCHANGED (logic): both baseline gates, the approval gate, and Stage B's
#       cut-and-verify flow. Stage B's delegate TARGET did move with the rename
#       below, but its behavior is untouched.
#   - Namespace rename: the bundle became `mj`, so every delegate target in this
#     recipe is now `mj:<agent>`. The blade agent keeps the name occams-machete;
#     only the prefix moved. The old targets no longer resolve.
#
# v1.1.0 (2026-06-07):
#   - CRITICAL FIX: The post-approval EXECUTE stage now BLOCKS on a red baseline.
#     * ROOT CAUSE (logic): The safety argument is "green BEFORE and green AFTER
#       ⇒ behavior preserved." green-BEFORE is load-bearing. Cutting from a red
#       baseline makes "green on both sides" vacuous — the suite cannot detect the
#       regression a cut might cause. The advisory REVIEW stage edits nothing and
#       is safe on a red baseline (it may still run); the EXECUTE stage is not.
#     * ROOT CAUSE (bug that made the premise unobservable): the baseline step ran
#       `{{test_command}} ... || echo ...`, so on failure the trailing `echo`
#       exited 0 and `baseline_exit_code` was ALWAYS "0". Any exit-code gate would
#       have been a silent no-op. The baseline now preserves the real exit code.
#     * FIX: Gate `execute-cuts` and `execute-verify-final` on
#       `baseline_exit_code == '0'`. On a non-zero baseline the execute stage
#       short-circuits to a terminal stop step (`execute-red-stop`) and makes NO
#       file edits, EVEN IF the human approved the advisory plan.
#     * FIX: The execute prompt now requires RE-VERIFYING static premises (caller
#       counts, dynamic-reference greps) at execution time, per stroke — the plan
#       is evidence, not proof, and the tree may have moved since review.
#     * RESULT: no automated cut can land from a red baseline; the panel can still
#       advise on a red baseline, but cutting requires green.
#
# v1.0.0 (2026-06-07):
#   - NEW FEATURE: Initial flagship "panel pipeline" recipe
#     * Stage A (review): advisory-only three-lens complexity review, no edits
#     * Approval gate: human reviews the ordered cut plan before any cut lands
#     * Stage B (execute): the approved cut, one reversible stroke at a time
#
# =============================================================================

name: "panel-then-cut"
description: >-
  Flagship panel pipeline. Two INDEPENDENT agents review in order: the Crusty
  Old Engineer asks "what would removing this break, and what will it cost?",
  then the Machete turns those findings into an ordered, proof-backed cut plan.
  Then a HUMAN APPROVAL GATE, then the cut. The agent that proposes the cut is
  never the agent that grades its risk. No irreversible edit lands until a human
  has seen and approved the plan AND the baseline is green.
version: "2.0.0"
author: "MJ's bench"
tags: ["reduction", "simplification", "occams-machete", "panel", "approval-gate"]

# Requirements:
#   - mj bundle loaded (provides the mj:occams-machete and
#     mj:crusty-old-engineer agents — both are delegated to by this recipe)
#
# Usage:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=mj:recipes/panel-then-cut.yaml \
#     context='{"target_path": "src/mymodule"}'
#
#   # Then, after Stage A pauses at the approval gate:
#   amplifier tool invoke recipes operation=approvals
#   amplifier tool invoke recipes operation=approve \
#     session_id=<session_id> stage_name=review

context:
  target_path: ""                       # Required: file/module/dir to review & reduce
  test_command: "python -m pytest -q"   # Optional: the safety-net test command

stages:
  # ===========================================================================
  # STAGE A — REVIEW (advisory only; MUST NOT modify any files)
  #
  # Reviewing is safe on ANY baseline, so this stage runs regardless of test
  # status — the panel should be able to reason about (and call out) a thin or
  # red safety net. Only the EXECUTE stage is gated on green.
  # ===========================================================================
  - name: "review"
    steps:
      # Record the baseline and capture its TRUE exit code (no `|| echo` masking,
      # and `exit $baseline_ec`) so the gate in Stage B is real, not a no-op.
      - id: "review-baseline"
        type: "bash"
        command: |
          echo "=== BASELINE: {{test_command}} ==="
          {{test_command}} 2>&1
          baseline_ec=$?
          if [ "$baseline_ec" -eq 0 ]; then
            echo "[baseline GREEN — exit 0]"
          else
            echo "[baseline NOT GREEN — exit $baseline_ec — the EXECUTE stage will refuse to cut]"
          fi
          exit $baseline_ec
        output: "baseline_tests"
        output_exit_code: "baseline_exit_code"
        on_error: "continue"
        timeout: 1800

      # LENS 1 — the reliability guard, as a REAL independent agent.
      # It must not be the same agent that proposes the cut: an agent grading
      # the risk of its own proposal is the circular reasoning this bundle's
      # own discipline forbids. Edits NOTHING.
      - id: "risk-review"
        agent: "mj:crusty-old-engineer"
        prompt: |
          ADVISORY ONLY. Do NOT modify, create, or delete any file.

          Target under review for REDUCTION: {{target_path}}
          Safety-net test command: {{test_command}}

          Baseline (exit code {{baseline_exit_code}} — non-zero means the safety
          net is RED or found no tests; if so, say so plainly: from a red
          baseline no cut can be proven behavior-preserving):
          ---
          {{baseline_tests}}
          ---

          Someone is about to remove code from this target. Your job is the
          question the blade skips: **what would removal break, and what would
          it cost later?**

          Hunt specifically:
            - Dynamic references a call-graph misses — getattr/setattr,
              importlib/__import__, entry points, plugin registries, string-keyed
              dispatch, template and config references.
            - Out-of-repo or public-surface consumers who may depend on
              observable behavior (Hyrum's Law), including anything exported.
            - Test-coverage gaps that would let a bad cut pass unnoticed —
              name the specific paths where the safety net is thin.
            - Anything whose apparent deadness is load-bearing (a fence with a
              reason you can find in git history, comments, or docs).

          OUTPUT — your usual contract, nothing else:
            BLOCKERS (removing this breaks something — with the evidence)
            RISKS (removing this costs you later — graded by likelihood × blast radius)
            SAFE-TO-CUT (candidates you found no removal hazard for, with what you checked)
        output: "risk_findings"
        timeout: 3600

      # LENS 2 — the blade turns the guard's findings into an ordered plan.
      # It proposes; it does not grade its own proposal's risk. Edits NOTHING.
      - id: "panel-review"
        agent: "mj:occams-machete"
        prompt: |
          ADVISORY ONLY. Do NOT modify, create, or delete any file in this
          stage. Produce a plan, not a cut.

          Target under review: {{target_path}}
          Safety-net test command: {{test_command}}

          Baseline (exit code {{baseline_exit_code}} — non-zero means the safety
          net is RED or found no tests; if so, say so plainly and treat every
          proposed cut as unverifiable until the suite is green):
          ---
          {{baseline_tests}}
          ---

          The reliability guard has already reviewed this target independently.
          Its findings are evidence you did not produce and must not overrule
          silently:
          ---
          {{risk_findings}}
          ---

          Your question is the one it skipped: **what comes out, in what safe
          order, with what proof for each?**

          Name what fails to earn its existence — dead code, speculative
          generality, abstractions with one caller, layers that only forward,
          configuration nobody flips — then turn it into an ORDERED,
          PROOF-BACKED cut plan: smallest and safest first, each stroke
          individually reversible, each with the specific evidence that makes it
          safe and the test signal that will confirm it.

          Honor the guard's findings explicitly:
            - Anything it called a BLOCKER does not enter the plan. If you
              believe it is wrong, say so and leave the stroke out anyway —
              that disagreement is for the human at the approval gate, not for
              you to resolve by cutting.
            - Anything it called a RISK enters the plan only with the extra
              proof that answers it, stated per stroke.

          OUTPUT (and nothing else — edit no files):
            1. Complexity inventory (what's accidental, why)
            2. Ordered, proof-backed cut plan (stroke 1..N, each with its proof)
            3. Test-coverage status (where the safety net is strong vs thin)
            4. Anything the guard flagged that you deliberately excluded, and why
            5. Confidence level (and what would raise it)
        output: "cut_plan"
        timeout: 3600

    # -------------------------------------------------------------------------
    # APPROVAL GATE — human sees the cut plan before any irreversible edit.
    # -------------------------------------------------------------------------
    approval:
      required: true
      prompt: |
        ===========================================================
        PANEL REVIEW COMPLETE — approve before any cut is made
        ===========================================================

        Target: {{target_path}}
        Safety net: {{test_command}}
        Baseline exit code: {{baseline_exit_code}}

        ----- ORDERED, PROOF-BACKED CUT PLAN (body-count preview) -----
        {{cut_plan}}
        ---------------------------------------------------------------

        Approve to let the Machete execute this plan one reversible stroke at
        a time (reverting any stroke that reddens the suite). Deny to stop —
        no files will be modified.

        NOTE: If the baseline exit code above is NOT 0, the EXECUTE stage will
        REFUSE to cut even if you approve here — structural cuts are not
        permitted from a red (or no-tests) baseline. Re-establish a green
        baseline first, or proceed manually.
      timeout: 0
      default: "deny"

  # ===========================================================================
  # STAGE B — EXECUTE (runs only after the gate is approved AND the FRESH
  # execute-time baseline is green — see execute-baseline below)
  # ===========================================================================
  - name: "execute"
    steps:
      # FRESH EXECUTE-TIME BASELINE. A human may approve long after the review,
      # and the tree may have moved since. "green-BEFORE" must be true NOW, at
      # execution time — not at review time — or the whole safety argument is
      # stale. We re-run the suite here and capture its TRUE exit code (no
      # `|| echo` masking; `exit $ec`). All Stage B gates key on THIS code, not
      # on the review-time {{baseline_exit_code}} (which is kept only as advisory
      # provenance). on_error: continue keeps the recipe alive so the gate — not
      # a crash — decides what happens next.
      - id: "execute-baseline"
        type: "bash"
        command: |
          echo "=== EXECUTE-TIME BASELINE (re-verified after approval): {{test_command}} ==="
          {{test_command}} 2>&1
          ec=$?
          if [ "$ec" -eq 0 ]; then
            echo "[execute-time baseline GREEN — exit 0]"
          else
            echo "[execute-time baseline NOT GREEN — exit $ec — the cut will be refused]"
          fi
          exit $ec
        output: "execute_baseline_tests"
        output_exit_code: "execute_baseline_exit_code"
        on_error: "continue"
        timeout: 1800

      # GATE (red path): even with human approval, a non-zero FRESH baseline
      # blocks the cut. This is the only editing-adjacent step that fires in
      # Stage B when the execute-time baseline is red.
      - id: "execute-red-stop"
        type: "bash"
        condition: "{{execute_baseline_exit_code}} != '0'"
        command: |
          cat <<'EOF'
          ===========================================================
          EXECUTE BLOCKED — RED BASELINE (approval notwithstanding)
          ===========================================================

          The advisory plan was approved, but the safety net is not green NOW,
          at execution time (execute-time baseline exit code:
          {{execute_baseline_exit_code}}; review-time was
          {{baseline_exit_code}}). A human may have approved long after review,
          and the tree may have moved since. The reduction contract depends on
          "green BEFORE and green AFTER ⇒ behavior preserved," and green-BEFORE
          must hold at execution time. From a red (or no-tests) baseline that
          proof is vacuous: a cut cannot be shown to preserve behavior because
          the suite cannot detect the regression it might introduce.

          No files were modified.

          The only valid next moves are:
            1. Characterize / repair the test suite to GREEN, then re-run this
               recipe, OR
            2. Proceed MANUALLY, with a human owning the risk that the safety
               net is not trustworthy.

          Automated structural cuts are not permitted from a red baseline.
          EOF
          exit 0
        on_error: "continue"
        timeout: 60

      # The approved cut — runs ONLY when the FRESH execute-time baseline is green.
      - id: "execute-cuts"
        condition: "{{execute_baseline_exit_code}} == '0'"
        agent: "mj:occams-machete"
        prompt: |
          The cut plan below was reviewed and APPROVED by a human, and the
          safety net was re-verified GREEN at execution time (execute-time
          baseline exit code {{execute_baseline_exit_code}}; review-time was
          {{baseline_exit_code}}). Execute it.

          Target: {{target_path}}
          Safety-net test command: {{test_command}}

          Approved cut plan:
          ---
          {{cut_plan}}
          ---

          Execute it faithfully:
            - One reversible stroke at a time, in the approved order.
            - RE-VERIFY each stroke's static premises AT EXECUTION TIME, per
              stroke, BEFORE you make that cut. Do NOT trust the plan's numbers:
              re-run the caller-count and dynamic-reference checks yourself now
              (grep for reflection, getattr, string dispatch, importlib, entry
              points, registries, and exported/public-symbol consumers). The
              tree may have changed since the review; the plan is evidence, not
              proof. If a premise no longer holds, skip that stroke and record why.
            - Re-run {{test_command}} after EACH stroke.
            - Revert immediately any stroke that reddens the suite, and note it.
            - Do not invent new cuts beyond the approved plan; if you discover a
              plan stroke is unsafe, skip it and record why.

          End with the body count report:
            -N lines, -M files, -K abstractions, tests green.
        output: "machete_report"
        timeout: 3600

      # Post-condition — runs ONLY on the green path (nothing was cut otherwise).
      - id: "execute-verify-final"
        condition: "{{execute_baseline_exit_code}} == '0'"
        type: "bash"
        command: |
          echo "=== POST-CONDITION: {{test_command}} ==="
          {{test_command}} 2>&1
        output: "final_tests"
        output_exit_code: "final_exit_code"
        on_error: "continue"
        timeout: 1800
