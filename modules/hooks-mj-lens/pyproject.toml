[project]
name = "amplifier-module-hooks-mj-lens"
version = "0.1.0"
description = "Session hook that surfaces MJ's review lens as an inline insight block."
requires-python = ">=3.11"
license = { text = "MIT" }
# amplifier-core is a PEER dependency provided by the runtime — do NOT declare it here.
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-mj-lens = "amplifier_module_hooks_mj_lens:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_mj_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Test-only tooling. amplifier-core stays OUT of [project.dependencies] because it
# is a runtime peer dep provided by the host; tests get a real-or-stub shim via
# tests/conftest.py instead of a hard dependency here.
[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
