[project]
name = "amplifier-module-hooks-machete-blocks"
version = "0.1.0"
description = "Session hook that surfaces notable Machete callouts as an inline block."
requires-python = ">=3.11"
license = { text = "MIT" }
# amplifier-core is a PEER dependency provided by the runtime — do NOT declare it here.
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-machete-blocks = "amplifier_module_hooks_machete_blocks:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_machete_blocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
